<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1C2126">
<title>PORTA · Camioneta CH-04</title>
<style>
:root{
  --naranjo:#F26B1D; --naranjo-2:#FF8A3D; --naranjo-suave:#FDE9DC;
  --grafito:#1C2126; --grafito-2:#2A3138; --gris:#6B7580; --linea:#E4E1DA;
  --fondo:#F5F3EE; --blanco:#FFFFFF;
  --ok:#2E9E5B; --ok-suave:#E3F4EA; --alerta:#E0A100; --alerta-suave:#FFF4D6; --peligro:#D64541; --peligro-suave:#FBE5E4;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--fondo);color:var(--grafito);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

/* barra superior */
.top{background:var(--grafito);color:#fff;padding:14px 18px 18px;position:sticky;top:0;z-index:5}
.top-row{display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.14em;font-size:15px}
.logo i{width:22px;height:22px;border-radius:6px;background:var(--naranjo);display:grid;place-items:center}
.logo i svg{width:14px;height:14px}
.pill{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;background:rgba(255,255,255,.08);padding:6px 10px;border-radius:99px;color:#cfd5db}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(46,158,91,.25)}
.back{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.08);display:grid;place-items:center}
.back svg{width:18px;height:18px}
.top h1{font-size:22px;font-weight:700;margin-top:14px;letter-spacing:-.01em}
.top p{font-size:13px;color:#aab3bc;margin-top:4px}

main{flex:1;padding:16px 16px 28px}
.sec{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gris);margin:18px 4px 10px}
.sec:first-child{margin-top:4px}

/* tarjeta de estado */
.estado{background:#fff;border:1px solid var(--linea);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center}
.estado .ico{width:42px;height:42px;border-radius:12px;background:var(--naranjo-suave);color:var(--naranjo);display:grid;place-items:center;flex:none}
.estado b{font-size:14px;display:block}
.estado span{font-size:12.5px;color:var(--gris)}

/* grilla de módulos */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mod{background:#fff;border:1px solid var(--linea);border-radius:var(--r);padding:14px;min-height:118px;display:flex;flex-direction:column;gap:10px;position:relative;text-align:left}
.mod .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center}
.mod b{font-size:14.5px;line-height:1.2}
.mod span{font-size:12px;color:var(--gris);margin-top:-6px}
.mod .badge{position:absolute;top:12px;right:12px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px}
.mod.ancho{grid-column:span 2;min-height:auto;flex-direction:row;align-items:center}
.mod.ancho .txt{display:flex;flex-direction:column;gap:2px}
.mod.ancho span{margin-top:0}
.c-doc{background:#E8EEF7;color:#2F5D9E}.c-veh{background:var(--naranjo-suave);color:var(--naranjo)}
.c-fat{background:#EFE7F8;color:#6A3FA0}.c-gen{background:var(--alerta-suave);color:#9A6B00}
.c-emg{background:var(--peligro-suave);color:var(--peligro)}.c-reg{background:var(--ok-suave);color:var(--ok)}
.ico svg{width:20px;height:20px}

/* listas */
.lista{background:#fff;border:1px solid var(--linea);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--linea);width:100%;text-align:left}
.item:first-child{border-top:0}
.item .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.item .txt{flex:1;min-width:0}
.item b{font-size:14px;font-weight:600;display:block}
.item span{font-size:12px;color:var(--gris)}
.chev{color:#b5bcc3}
.chev svg{width:16px;height:16px}
.buscar{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--linea);border-radius:12px;padding:11px 12px;color:var(--gris);font-size:14px;margin-bottom:6px}
.buscar svg{width:16px;height:16px}
.buscar input{border:0;outline:0;font:inherit;flex:1;background:transparent;color:var(--grafito)}

/* visor de documento */
.doc{background:#fff;border:1px solid var(--linea);border-radius:var(--r);padding:20px 18px;font-size:13.5px;line-height:1.55}
.doc .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tag{font-size:11px;font-weight:600;padding:4px 8px;border-radius:6px;background:var(--fondo);color:var(--gris)}
.doc h2{font-size:17px;margin-bottom:4px}
.doc h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--naranjo);margin:16px 0 6px}
.doc ol,.doc ul{padding-left:18px}
.doc li{margin:4px 0}
.aviso{display:flex;gap:10px;background:var(--alerta-suave);border-radius:12px;padding:12px;font-size:12.5px;margin-top:14px;color:#6b4c00}

/* checklist */
.progreso{height:6px;background:var(--linea);border-radius:99px;overflow:hidden;margin:2px 4px 14px}
.progreso i{display:block;height:100%;background:var(--naranjo);border-radius:99px;transition:width .3s}
.preg{background:#fff;border:1px solid var(--linea);border-radius:var(--r);padding:14px;margin-bottom:10px}
.preg .q{display:flex;gap:8px;font-size:14px;font-weight:600;line-height:1.35}
.preg .q small{display:block;font-weight:500;color:var(--gris);font-size:12px;margin-top:2px}
.crit{flex:none;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--peligro);background:var(--peligro-suave);padding:3px 6px;border-radius:5px;height:fit-content}
.opts{display:flex;gap:8px;margin-top:12px}
.opt{flex:1;padding:10px 0;border-radius:10px;border:1.5px solid var(--linea);font-weight:600;font-size:13.5px;background:#fff}
.opt.si.on{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no.on{background:var(--peligro);border-color:var(--peligro);color:#fff}
.opt.na.on{background:var(--gris);border-color:var(--gris);color:#fff}
.opt.v.on{background:var(--naranjo);border-color:var(--naranjo);color:#fff}
.escala{display:flex;gap:6px;margin-top:12px}
.escala .opt{padding:10px 0}
.campo{margin-top:10px}
.campo input,.campo select{width:100%;border:1.5px solid var(--linea);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;background:#fff}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:14px;background:var(--naranjo);color:#fff;font-weight:700;font-size:15px;margin-top:6px}
.btn.sec2{background:#fff;color:var(--grafito);border:1.5px solid var(--linea)}
.btn[disabled]{opacity:.45}
.btn svg{width:18px;height:18px}

/* resultado */
.res{border-radius:20px;padding:22px 18px;text-align:center;color:#fff}
.res .big{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;margin:0 auto 12px}
.res .big svg{width:34px;height:34px}
.res h2{font-size:22px}
.res p{font-size:13.5px;opacity:.92;margin-top:6px;line-height:1.45}
.res.ok{background:var(--ok)}.res.alerta{background:#C98F00}.res.mal{background:var(--peligro)}
.resumen{background:#fff;border:1px solid var(--linea);border-radius:var(--r);padding:4px 14px;margin-top:12px}
.resumen div{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--linea);font-size:13px}
.resumen div:first-child{border-top:0}
.resumen span{color:var(--gris)}
.obs{font-size:12.5px;background:var(--peligro-suave);color:#8a2420;border-radius:10px;padding:10px 12px;margin-top:10px}

/* bienvenida (al tocar NFC) */
.hero{background:var(--grafito);color:#fff;min-height:100vh;display:flex;flex-direction:column;padding:28px 22px}
.hero .logo{font-size:18px}
.hero .logo i{width:28px;height:28px}
.hero .logo i svg{width:17px;height:17px}
.hero h1{font-size:30px;line-height:1.1;margin-top:auto;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--naranjo-2)}
.hero p{color:#aab3bc;font-size:14.5px;margin-top:10px;line-height:1.5}
.hero .ondas{width:170px;height:170px;margin:70px auto 0;position:relative}
.hero .ondas span{position:absolute;inset:0;border-radius:50%;border:2px solid var(--naranjo);opacity:0;animation:onda 2.4s infinite}
.hero .ondas span:nth-child(1){animation-delay:-.4s}.hero .ondas span:nth-child(2){animation-delay:-1.2s}.hero .ondas span:nth-child(3){animation-delay:-2s}
.hero .ondas b{position:absolute;inset:52px;border-radius:50%;background:var(--naranjo);display:grid;place-items:center}
.hero .ondas b svg{width:26px;height:26px}
@keyframes onda{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.2);opacity:0}}
.hero .datos{display:flex;gap:8px;margin:28px 0 18px}
.hero .datos div{flex:1;background:rgba(255,255,255,.06);border-radius:12px;padding:10px;font-size:11px;color:#aab3bc}
.hero .datos b{display:block;color:#fff;font-size:15px;margin-top:2px}
.pie{font-size:11px;color:var(--gris);text-align:center;padding:6px 0 18px}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ===== Íconos (trazo simple) ===== */
const I = {

/* ===== Datos de ejemplo (en el equipo real vienen de la carpeta de Drive) ===== */
const EQUIPO = { nombre:'PORTA · Camioneta CH-04', faena:'Faena Quebrada Alta', sync:'Hoy 07:12', docs:42 };

const CATEGORIAS = [
  { id:'pts', nombre:'Procedimientos de trabajo', desc:'PTS y estándares', ico:'doc', c:'c-doc' },

const DOCS = [

  { id:'pts-generador', cat:'pts', nombre:'PTS-027 Uso de generador portátil', ver:'v2 · jun 2026', pags:4 },

  vehiculo:{ titulo:'Checklist de vehículo', sub:'Inspección pre-uso · CH-04', ico:'truck', c:'c-veh', tipo:'sino', preguntas:[
    { q:'Neumáticos en buen estado y con presión correcta', crit:true },
    { q:'Rueda de repuesto, gata y llave', crit:false },

const cab = (titulo, sub, volver) => `

const V = {
  bienvenida(){
    return `<div class="hero">

      </div>
      <div class="sec">Emergencia</div>
      <div class="grid">
        <a class="mod ancho" href="#/doc/plan-emergencia">${ico('sos','c-emg')}<div class="txt"><b>Plan de emergencia</b><span>Contactos, punto de encuentro y canal radial</span></div></a>
      </div>
    </main><div class="pie">PORTA funciona sin internet · Red Wi-Fi local del vehículo</div>`;
  },

  docs(){
    return cab('Biblioteca', `${DOCS.length} documentos disponibles sin conexión`, '#/') + `<main>
      <label class="buscar">${I.search}<input placeholder="Buscar procedimiento, HDS, contrato…" oninput="filtrar(this.value)"></label>
      <div id="docs-res">${listaCategorias()}</div>
    </main>`;
  },

  cat(id){
    const c = CATEGORIAS.find(x=>x.id===id);
    return cab(c.nombre, c.desc, '#/docs') + `<main><div class="lista">${DOCS.filter(d=>d.cat===id).map(itemDoc).join('')}</div></main>`;
  },

  doc(id){
    const d = DOCS.find(x=>x.id===id);
    const c = CATEGORIAS.find(x=>x.id===d.cat);
    return cab(d.nombre, `${c.nombre} · ${d.ver}`, d.cat==='emergencia' ? '#/' : `#/docs/${d.cat}`) + `<main><div class="doc">
      <div class="meta"><span class="tag">${d.ver}</span><span class="tag">${d.pags} páginas</span><span class="tag">Copia controlada</span></div>
      ${CONTENIDO[id] || CONTENIDO._generico(d)}
    </div></main>`;
  },

  check(id){
    const ck = CHECKLISTS[id];
    S.resp[id] = S.resp[id] || {};
    const r = S.resp[id];
    const total = ck.preguntas.length;
    const hechas = ck.preguntas.filter((p,i)=>r[p.id||i]!==undefined && r[p.id||i]!=='').length;
    const pregs = ck.preguntas.map((p,i)=>{
      const k = p.id||i, v = r[k];
      let ctrl;
      if (ck.tipo==='sino' || p.tipo==='sino'){
        ctrl = `<div class="opts">
          <button class="opt si ${v==='si'?'on':''}" onclick="resp('${id}','${k}','si')">Sí</button>
          <button class="opt no ${v==='no'?'on':''}" onclick="resp('${id}','${k}','no')">No</button>
          ${ck.tipo==='sino' ? `<button class="opt na ${v==='na'?'on':''}" onclick="resp('${id}','${k}','na')">N/A</button>` : ''}
        </div>`;
      } else if (p.tipo==='escala'){
        ctrl = `<div class="escala">${[1,2,3,4,5].map(n=>`<button class="opt v ${v==n?'on':''}" onclick="resp('${id}','${k}',${n})">${n}</button>`).join('')}</div>`;
      } else if (p.tipo==='horas'){
        ctrl = `<div class="escala">${['<5','5','6','7','8+'].map(n=>`<button class="opt v ${v===n?'on':''}" onclick="resp('${id}','${k}','${n}')">${n}</button>`).join('')}</div>`;
      }
      return `<div class="preg"><div class="q"><div>${i+1}. ${p.q}${p.h?`<small>${p.h}</small>`:''}</div>${p.crit?'<span class="crit">CRÍTICO</span>':''}</div>${ctrl}</div>`;
    }).join('');
    return cab(ck.titulo, ck.sub, '#/') + `<main>
      <div class="campo" style="margin:0 0 12px"><input id="nombre" placeholder="Nombre de quien inspecciona" value="${S.nombre||''}" oninput="S.nombre=this.value"></div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--gris);margin:0 4px 6px"><span>Progreso</span><span>${hechas} de ${total}</span></div>
      <div class="progreso"><i style="width:${hechas/total*100}%"></i></div>
      ${pregs}
      <button class="btn" ${hechas<total?'disabled':''} onclick="enviar('${id}')">${I.check} Guardar checklist</button>
    </main>`;
  },

  resultado(id){
    const ck = CHECKLISTS[id], ev = evaluar(id);
    const icono = ev.estado==='ok' ? I.check : ev.estado==='alerta' ? I.warn : I.x;
    return cab(ck.titulo, 'Resultado guardado en PORTA', '#/') + `<main>
      <div class="res ${ev.estado}"><div class="big">${icono}</div><h2>${ev.titulo}</h2><p>${ev.texto}</p></div>
      ${ev.obs.length ? `<div class="obs"><b>Observaciones:</b><br>${ev.obs.join('<br>')}</div>` : ''}
      <div class="resumen">
        <div><span>Inspector</span><b>${S.nombre||'Sin nombre'}</b></div>
        <div><span>Fecha y hora</span><b>${new Date().toLocaleString('es-CL',{dateStyle:'short',timeStyle:'short',hourCycle:'h23'})}</b></div>
        <div><span>Equipo</span><b>${EQUIPO.nombre.split('· ')[1]}</b></div>
        <div><span>Envío a la nube</span><b>Pendiente · al volver a base</b></div>
      </div>
      <a class="btn" href="#/" style="margin-top:16px">Volver al menú</a>
      <a class="btn sec2" href="#/registros">Ver registros</a>
    </main>`;
  },

  registros(){
    return cab('Registros', 'Checklists guardados en este equipo', '#/') + `<main>
      <div class="lista">${S.registros.slice().reverse().map(r=>{
        const ck = CHECKLISTS[r.id];
        const col = r.estado==='ok'?'var(--ok)':r.estado==='alerta'?'#C98F00':'var(--peligro)';
        return `<div class="item">${ico(ck.ico, ck.c)}<div class="txt"><b>${ck.titulo}</b><span>${r.quien} · ${r.hora}</span></div><b style="font-size:12px;color:${col}">${r.res}</b></div>`;
      }).join('')}</div>
      <div class="estado" style="margin-top:12px">${ico('sync','')}<div><b>${S.registros.length} registros por enviar</b><span>Se suben solos a la carpeta de Drive cuando PORTA vuelve a tener Wi-Fi.</span></div></div>
    </main>`;
  },
};

function listaCategorias(){
  return `<div class="lista">${CATEGORIAS.map(c=>{
    const n = DOCS.filter(d=>d.cat===c.id).length;
    return `<a class="item" href="#/docs/${c.id}">${ico(c.ico,c.c)}<div class="txt"><b>${c.nombre}</b><span>${n} documento${n>1?'s':''} · ${c.desc}</span></div><span class="chev">${I.chev}</span></a>`;
  }).join('')}</div>`;
}
const itemDoc = d => `<a class="item" href="#/doc/${d.id}">${ico('doc','c-doc')}<div class="txt"><b>${d.nombre}</b><span>${d.ver} · ${d.pags} pág.</span></div><span class="chev">${I.chev}</span></a>`;
window.filtrar = q => {
  const el = document.getElementById('docs-res');
  q = q.trim().toLowerCase();
  el.innerHTML = q ? `<div class="lista">${DOCS.filter(d=>d.nombre.toLowerCase().includes(q)).map(itemDoc).join('') || '<div class="item"><span>Sin resultados</span></div>'}</div>` : listaCategorias();
};

/* ===== Lógica de checklists ===== */
window.resp = (id,k,v) => { S.resp[id][k]=v; const y=scrollY; render(); scrollTo(0,y); };
function evaluar(id){
  const ck = CHECKLISTS[id], r = S.resp[id]||{};
  if (ck.tipo==='fatiga'){
    let pts = 0; const obs=[];
    if (r.horas==='<5'){pts+=2;obs.push('Menos de 5 horas de sueño');} else if (r.horas==='5'){pts+=1;obs.push('Solo 5 horas de sueño');}
    if (r.escala>=4){pts+=2;obs.push('Somnolencia alta autodeclarada');} else if (r.escala==3) pts+=1;
    ['alcohol','jornada','sintomas'].forEach(k=>{ if(r[k]==='si'){ pts+= k==='alcohol'?3:2; obs.push(ck.preguntas.find(p=>p.id===k).q.replace('¿','').replace('?','')); }});
    if (pts>=3) return {estado:'mal',titulo:'No apto para conducir',texto:'Avisa a tu supervisor por radio antes de operar. Se recomienda descanso y relevo de conductor.',obs,res:'No apto'};
    if (pts>=1) return {estado:'alerta',titulo:'Apto con precaución',texto:'Haz pausas cada 2 horas, hidrátate y comunica tu estado al supervisor.',obs,res:'Precaución'};
    return {estado:'ok',titulo:'Apto para conducir',texto:'¡Buen turno! Recuerda hacer pausas activas durante la jornada.',obs,res:'Apto'};
  }
  const fallas = ck.preguntas.map((p,i)=>({p,v:r[i]})).filter(x=>x.v==='no');
  const crit = fallas.filter(x=>x.p.crit);
  const obs = fallas.map(x=>(x.p.crit?'⚠ ':'')+x.p.q);
  if (crit.length) return {estado:'mal',titulo:'No operar',texto:'Hay ítems críticos con falla. Informa a tu supervisor y no uses el equipo hasta corregirlos.',obs,res:'No operar'};
  if (fallas.length) return {estado:'alerta',titulo:'Operar con observaciones',texto:'Sin fallas críticas. Reporta las observaciones para su corrección.',obs,res:'Observado'};
  return {estado:'ok',titulo:'Apto para operar',texto:'Todos los ítems están conformes. Registro guardado.',obs,res:'Apto para operar'};
}
window.enviar = id => {
  const ev = evaluar(id);
  S.registros.push({ id, quien:S.nombre||'Sin nombre', hora:'Hoy '+new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit',hourCycle:'h23'}), res:ev.res, estado:ev.estado });
  location.hash = `#/check/${id}/resultado`;
};

/* ===== Contenido de ejemplo de documentos ===== */
const CONTENIDO = {
  'pts-conduccion':`<h2>Conducción en faena</h2><p>Establecer las medidas de control para la conducción segura de vehículos livianos dentro de la faena y en caminos de acceso.</p>
    <h3>Antes de conducir</h3><ol><li>Realizar el <b>checklist de vehículo</b> pre-uso.</li><li>Completar la autoevaluación de <b>fatiga y somnolencia</b>.</li><li>Verificar comunicación radial con control.</li></ol>
    <h3>Durante la conducción</h3><ul><li>Velocidad máxima en faena: 40 km/h; en rampas: 30 km/h.</li><li>Mantener distancia mínima de 60 m con equipos de alto tonelaje.</li><li>Uso permanente de cinturón y luces encendidas.</li><li>Pausa obligatoria cada 2 horas de conducción continua.</li></ul>
    <div class="aviso">${'⚠'} Ante somnolencia: detenerse en zona segura, avisar por radio y esperar relevo.</div>`,
  'pts-generador':`<h2>Uso de generador portátil</h2><p>Operar generadores portátiles diésel de forma segura en terreno.</p>
    <h3>Riesgos principales</h3><ul><li>Intoxicación por monóxido de carbono.</li><li>Contacto eléctrico.</li><li>Incendio por derrame de combustible.</li><li>Exposición a ruido.</li></ul>
    <h3>Medidas de control</h3><ol><li>Instalar siempre al aire libre, lejos de ventanas y tomas de aire.</li><li>Conectar a tierra antes de energizar.</li><li>Cargar combustible con el motor detenido y frío.</li><li>Mantener extintor PQS a menos de 10 m.</li></ol>
    <div class="aviso">⚠ Completa el checklist de generador en PORTA antes de cada uso.</div>`,
  'plan-emergencia':`<h2>Plan de emergencia</h2><p>Faena Quebrada Alta · Sector camino de acceso km 0–38.</p>
    <h3>Contactos</h3><ul><li><b>Control de faena:</b> radio canal 3</li><li><b>Policlínico faena:</b> radio canal 5</li><li><b>Supervisor de turno:</b> radio canal 3, clave “Alfa-2”</li></ul>
    <h3>Ante un accidente</h3><ol><li>Detener la tarea y asegurar el área.</li><li>Comunicar por radio: ubicación (km), tipo de evento y n.º de lesionados.</li><li>No mover a lesionados salvo riesgo inminente.</li><li>Esperar instrucciones de control.</li></ol>
    <h3>Punto de encuentro</h3><p>Garita km 0, explanada norte.</p>
    <div class="aviso">⚠ Sin cobertura celular entre km 6 y km 38: usar siempre la radio.</div>`,
  _generico: d => `<h2>${d.nombre}</h2><p>Vista previa del documento sincronizado desde la carpeta de Drive. En el equipo real se muestra el PDF original completo (${d.pags} páginas) y se puede descargar al teléfono.</p>
    <h3>Contenido</h3><ol><li>Objetivo y alcance</li><li>Responsabilidades</li><li>Desarrollo</li><li>Registros y anexos</li></ol>`,
};

/* ===== Router ===== */
function render(){
  const h = (location.hash || '#/').slice(2).split('/');
  let html;
  if (h[0]==='bienvenida') html = V.bienvenida();
  else if (h[0]==='docs' && h[1]) html = V.cat(h[1]);
  else if (h[0]==='docs') html = V.docs();
  else if (h[0]==='doc') html = V.doc(h[1]);
  else if (h[0]==='check' && h[2]==='resultado') html = V.resultado(h[1]);
  else if (h[0]==='check') html = V.check(h[1]);
  else if (h[0]==='registros') html = V.registros();
  else html = V.inicio();
  $app.innerHTML = html;
}
addEventListener('hashchange', ()=>{ render(); scrollTo(0,0); });
render();
window.PORTA = { S, render }; // para capturas automáticas
</script>
