<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PORTA Central · demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --n:#F26B1D;--n2:#FF8A3D;--ns:#FDE9DC;--g:#1C2126;--g2:#2A3138;--g3:#343c45;--gr:#6B7580;--l:#E4E1DA;--f:#F5F3EE;
  --ok:#2E9E5B;--oks:#E3F4EA;--al:#C98F00;--als:#FFF4D6;--pe:#D64541;--pes:#FBE5E4;--az:#2F5D9E;--azs:#E8EEF7;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--f);color:var(--g);-webkit-font-smoothing:antialiased;font-size:14px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.lay{display:grid;grid-template-columns:232px 1fr;min-height:100vh}

/* barra lateral */
.side{background:var(--g);color:#cfd5db;padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.16em;color:#fff;font-size:15px;padding:0 8px 22px}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--n);display:grid;place-items:center}
.logo i svg{width:17px}
.logo small{display:block;font-size:10px;letter-spacing:.14em;color:var(--n2);font-weight:700;margin-top:1px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-weight:500}
.nav svg{width:18px;height:18px;opacity:.8}
.nav.on{background:rgba(255,255,255,.08);color:#fff}
.nav.on svg{color:var(--n2);opacity:1}
.nav .cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--pe);color:#fff;border-radius:99px;padding:1px 7px}
.side .yo{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border-top:1px solid rgba(255,255,255,.08);font-size:12.5px}
.side .yo b{display:block;color:#fff;font-size:13px}
.av{width:32px;height:32px;border-radius:50%;background:var(--n);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}

/* contenido */
.main{padding:26px 32px 40px;min-width:0}
.head{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px}
.head h1{font-size:26px;letter-spacing:-.01em}
.head p{color:var(--gr);margin-top:4px}
.head .acc{margin-left:auto;display:flex;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;background:var(--n);color:#fff;font-weight:600}
.btn.s{background:#fff;color:var(--g);border:1px solid var(--l)}
.btn svg{width:16px;height:16px}
.crumb{font-size:12.5px;color:var(--gr);margin-bottom:6px}
.crumb a{color:var(--n);font-weight:600}

.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--l);border-radius:14px;padding:16px}
.kpi small{color:var(--gr);font-size:12px;display:flex;align-items:center;gap:6px}
.kpi b{font-size:28px;display:block;margin-top:6px;letter-spacing:-.02em}
.kpi span{font-size:12px;color:var(--gr)}
.kpi.al{border-color:#f3c3c1;background:#fff8f7}
.kpi.al b{color:var(--pe)}

.box{background:#fff;border:1px solid var(--l);border-radius:14px;overflow:hidden}
.box-h{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--l)}
.box-h h2{font-size:15px}
.box-h .f{margin-left:auto;display:flex;gap:8px}
.chip{font-size:12px;font-weight:600;padding:6px 11px;border-radius:99px;background:var(--f);color:var(--gr)}
.chip.on{background:var(--g);color:#fff}
.srch{display:flex;align-items:center;gap:8px;border:1px solid var(--l);border-radius:9px;padding:7px 10px;color:var(--gr);font-size:13px;width:240px}
.srch svg{width:15px}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gr);font-weight:700;padding:10px 18px;background:#fbfaf7;border-bottom:1px solid var(--l)}
td{padding:12px 18px;border-bottom:1px solid #efece6;vertical-align:middle;font-size:13.5px}
tr:last-child td{border-bottom:0}
tr.cl{cursor:pointer}
tr.cl:hover td{background:#fcfbf8}
.veh{display:flex;align-items:center;gap:10px}
.veh .ic{width:34px;height:34px;border-radius:9px;background:var(--ns);color:var(--n);display:grid;place-items:center;flex:none}
.veh .ic svg{width:18px}
.veh b{display:block;font-size:13.5px}
.veh span{font-size:12px;color:var(--gr);white-space:nowrap}
.veh b{white-space:nowrap}
.est{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;white-space:nowrap}
.est i{width:7px;height:7px;border-radius:50%;background:currentColor}
.e-on{background:var(--oks);color:var(--ok)}.e-off{background:#eef0f2;color:#5b6570}.e-base{background:var(--azs);color:var(--az)}
.ver{font-size:12.5px;white-space:nowrap}
.ver.ok{color:var(--ok)}.ver.pend{color:var(--al)}
.ver small{display:block;color:var(--gr);font-size:11px}
.rec{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--gr)}
.rec i{width:8px;height:8px;border-radius:50%;background:#e04848}
.alrt{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--pe);background:var(--pes);padding:4px 9px;border-radius:99px;white-space:nowrap}
.mut{color:var(--gr);font-size:12.5px}
.bar{height:6px;background:#eceae4;border-radius:99px;overflow:hidden;width:90px;display:inline-block;vertical-align:middle;margin-right:6px}
.bar i{display:block;height:100%;background:var(--n)}

/* documentos */
.dgrid{display:grid;grid-template-columns:250px 1fr;gap:18px}
.tree{background:#fff;border:1px solid var(--l);border-radius:14px;padding:10px}
.tree a{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;font-size:13.5px}
.tree a.on{background:var(--ns);color:#b44c0e;font-weight:600}
.tree a svg{width:16px;color:var(--gr)}
.tree a.on svg{color:var(--n)}
.tree a span{margin-left:auto;font-size:11.5px;color:var(--gr)}
.drop{border:2px dashed #d9c2b2;background:#fffaf6;border-radius:14px;padding:20px;display:flex;align-items:center;gap:16px;margin-bottom:16px}
.drop .ic{width:46px;height:46px;border-radius:12px;background:var(--ns);color:var(--n);display:grid;place-items:center;flex:none}
.drop .ic svg{width:22px}
.drop b{font-size:14.5px}
.drop p{font-size:12.5px;color:var(--gr);margin-top:2px}
.drop .btn{margin-left:auto}
.pub{background:var(--g);color:#fff;border-radius:14px;padding:16px 18px;margin-bottom:16px;display:grid;grid-template-columns:1fr auto;gap:10px 24px;align-items:center}
.pub b{font-size:14.5px}
.pub p{font-size:12.5px;color:#aab3bc;margin-top:3px}
.pub .pb{grid-column:1/-1;height:8px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
.pub .pb i{display:block;height:100%;background:linear-gradient(90deg,var(--n),var(--n2));border-radius:99px}
.pub .n{font-size:22px;font-weight:800;text-align:right}
.pub .n small{display:block;font-size:11px;font-weight:500;color:#aab3bc}
.pdf{width:30px;height:36px;border-radius:5px;background:var(--pes);color:var(--pe);font-size:9px;font-weight:800;display:grid;place-items:center;flex:none}

/* detalle */
.det{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
.cams{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px}
.cam{position:relative;border-radius:10px;overflow:hidden;background:#000;aspect-ratio:16/9}
.cam img{width:100%;height:100%;object-fit:cover;display:block}
.cam .tl{position:absolute;top:8px;left:8px;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.45);padding:4px 8px;border-radius:6px;font-family:"JetBrains Mono",monospace}
.cam .tl i{width:7px;height:7px;border-radius:50%;background:#ff4d4d}
.cam .br{position:absolute;bottom:8px;right:8px;left:8px;display:flex;justify-content:space-between;font-size:10.5px;color:#fff;font-family:"JetBrains Mono",monospace;text-shadow:0 1px 2px #000}
.ev{display:flex;gap:10px;padding:0 14px 14px}
.ev div{flex:1;background:var(--f);border-radius:10px;padding:10px 12px;font-size:12px}
.ev b{display:block;font-size:13px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--l)}
.kv div{background:#fff;padding:12px 16px}
.kv small{display:block;color:var(--gr);font-size:11.5px}
.kv b{font-size:14px}
.tl2{padding:6px 18px 12px}
.tli{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #efece6;font-size:13px;align-items:center}
.tli:last-child{border-bottom:0}
.tli .t{font-weight:400;font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--gr);width:44px;flex:none}
.tli .d{width:10px;height:10px;border-radius:50%;flex:none}
.tli span{margin-left:auto}
.map{height:210px;position:relative;background:#efe6d6}
.map svg{width:100%;height:100%;display:block}

/* alertas */
.agrid{display:grid;grid-template-columns:1fr 380px;gap:18px}
.acard{padding:18px}
.acard h3{font-size:18px;margin:8px 0 4px}
.acard .obs{background:var(--pes);color:#8a2420;border-radius:10px;padding:12px;font-size:12.5px;line-height:1.6;margin:14px 0}
.acard .acts{display:flex;flex-direction:column;gap:8px}
.acard .btn{justify-content:center}


/* ===== panel del presentador ===== */
.pres{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
body.sinpanel .pres{grid-template-columns:0 1fr}
body.sinpanel .panel{visibility:hidden;padding:0}
.panel{position:sticky;top:0;height:100vh;overflow:auto;background:#121518;color:#e9edf0;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.panel .lg{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.16em;font-size:14px}
.panel .lg i{width:26px;height:26px;border-radius:7px;background:var(--n);display:grid;place-items:center}.panel .lg i svg{width:15px}
.panel .lg small{color:#FF8A3D;font-size:10px;letter-spacing:.14em}
.pc{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px}
.pc h4{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#8a949e;margin-bottom:8px}
.qr{background:#fff;border-radius:12px;padding:8px;display:grid;place-items:center}.qr svg{width:100%;height:auto;display:block}
.qrt{font-size:13px;font-weight:700;margin-top:8px;text-align:center}.qrt small{display:block;font-weight:400;color:#8a949e;font-size:11px;margin-top:3px;word-break:break-all}
.sw2{display:flex;background:#2a1f1d;border-radius:99px;padding:4px;cursor:pointer}
.sw2 span{flex:1;text-align:center;padding:8px 0;border-radius:99px;font-size:12.5px;font-weight:700;opacity:.55}
.sw2 span.on{opacity:1;color:#fff}.sw2 .a.on{background:var(--pe)}.sw2 .b.on{background:var(--ok)}
.enl{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:9px;color:#c3cbd2}.enl i{width:8px;height:8px;border-radius:50%;flex:none}
.pp{display:flex;gap:9px;padding:7px 4px;border-radius:9px;font-size:12px;line-height:1.38;color:#c3cbd2}
.pp .nn{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:10.5px;font-weight:800;background:rgba(255,255,255,.08)}
.pp b{color:#fff;font-weight:600}.pp.act{background:rgba(242,107,29,.13)}.pp.act .nn{background:var(--n);color:#fff}
.pp.ok{color:#8a949e}.pp.ok .nn{background:var(--ok);color:#fff}.pp.ok b{color:#8a949e;text-decoration:line-through}
.pbt{display:flex;gap:8px}.pbt button{flex:1;padding:9px;border-radius:10px;background:rgba(255,255,255,.08);color:#e9edf0;font-size:12px;font-weight:600}
.mostrar{position:fixed;left:10px;bottom:10px;z-index:60;padding:8px 12px;border-radius:10px;background:#121518;color:#fff;font-size:12px;font-weight:600;display:none}
body.sinpanel .mostrar{display:block}
.subiendo{opacity:.6;pointer-events:none}

/* ===== demo ===== */
.demo{font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.08em;background:var(--n);color:#fff;padding:2px 6px;border-radius:5px;vertical-align:middle}
tr.vivo td{background:#fff8f2}
.drop{cursor:pointer;transition:.2s}
.drop.sobre{background:#ffe9d9;border-color:var(--n)}
.drop select{font:inherit;font-size:12.5px;border:1px solid var(--l);border-radius:7px;padding:3px 6px;background:#fff;margin:0 2px}
#toasts{position:fixed;top:18px;right:18px;display:flex;flex-direction:column;gap:10px;z-index:50;width:360px}
.toast{background:#fff;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.18);padding:14px 16px 14px 18px;border-left:6px solid var(--ok);display:grid;grid-template-columns:1fr auto;gap:2px 10px;animation:entra .35s ease;transition:.5s}
.toast b{font-size:14px}.toast span{grid-column:1;font-size:12.5px;color:var(--gr)}
.toast a{grid-row:1/3;grid-column:2;align-self:center;font-size:12.5px;font-weight:700;color:var(--n)}
.toast.mal{border-left-color:var(--pe)}.toast.mal b{color:var(--pe)}.toast.al{border-left-color:var(--al)}.toast.gr{border-left-color:var(--gr)}
.toast.fuera{opacity:0;transform:translateX(30px)}
@keyframes entra{from{opacity:0;transform:translateX(40px)}}
</style>
</head>
<body>
<div class="pres">
<aside class="panel">
  <div class="lg"><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M5 9a10 10 0 0 1 14 0"/><path d="M8 12.5a5.5 5.5 0 0 1 8 0"/><circle cx="12" cy="17" r="1.7" fill="#fff" stroke="none"/></svg></i>PORTA <small>DEMO EN VIVO</small></div>
  <div class="pc"><h4>Celular del trabajador</h4><div class="qr" id="qr"></div><div class="qrt">Escanea con tu celular<small>Es como escanear el QR del parabrisas de PORTA</small></div><div class="enl" style="justify-content:center"><i style="background:#FF8A3D"></i><span id="conectados"></span></div></div>
  <div class="pc"><h4>Vehículo CH-04</h4><div class="sw2" onclick="L.enviar({t:'senal',valor:!E.senal4g})"><span class="a" id="sw-a">Sin señal</span><span class="b" id="sw-b">Con señal 4G</span></div>
    <div class="enl"><i id="enl-d"></i><span id="enl-t"></span></div></div>
  <div class="pc"><h4>Guía para presentar</h4><div id="guia"></div></div>
  <div class="pbt"><button onclick="if(confirm('¿Reiniciar la demo para todos?'))L.enviar({t:'reiniciar'})">↺ Reiniciar</button><button onclick="document.body.classList.add('sinpanel')">Ocultar panel</button></div>
</aside>
<div class="lay">
  <aside class="side" id="side"></aside>
  <main class="main" id="main"></main>
</div>
</div>
<button class="mostrar" onclick="document.body.classList.remove('sinpanel')">Mostrar panel</button>
<div id="toasts"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const I = {
  logo:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M5 9a10 10 0 0 1 14 0"/><path d="M8 12.5a5.5 5.5 0 0 1 8 0"/><circle cx="12" cy="17" r="1.7" fill="#fff" stroke="none"/></svg>',
  flota:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7h11v9H2zM13 10h4l4 3v3h-8"/><circle cx="6" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>',
  docs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>',
  alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg>',
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg>',
  conf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>',
  send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"/></svg>',
};

/* ===== Flota de ejemplo (CH-04 es el vehículo de la demo) ===== */
const FLOTA = [
  { id:'CH-04', tipo:'Camioneta 4x4', pat:'RT·KD-41', faena:'Quebrada Alta', cond:'Juan Pérez', est:'off', ult:'hace 38 min', ver:'ok', chk:'2/3', alerta:'Fatiga: no apto', mem:62 },
  { id:'CH-07', tipo:'Camioneta 4x4', pat:'SB·LP-19', faena:'Quebrada Alta', cond:'María Rojas', est:'on', ult:'ahora', ver:'ok', chk:'3/3', mem:41 },
  { id:'CH-11', tipo:'Camioneta 4x4', pat:'PX·TR-72', faena:'Quebrada Alta', cond:'Luis Araya', est:'on', ult:'ahora', ver:'ok', chk:'3/3', mem:55 },
  { id:'CA-02', tipo:'Camión aljibe', pat:'HK·WZ-08', faena:'Sierra Norte', cond:'Pedro Soto', est:'off', ult:'hace 2 h', ver:'pend', chk:'1/3', alerta:'Vehículo: no operar', mem:78 },
  { id:'CH-15', tipo:'Camioneta 4x4', pat:'LL·GH-33', faena:'Sierra Norte', cond:'Ana Cortés', est:'on', ult:'hace 1 min', ver:'ok', chk:'3/3', mem:33 },
  { id:'BU-01', tipo:'Bus de personal', pat:'FZ·RD-56', faena:'Campamento', cond:'Raúl Díaz', est:'base', ult:'ahora', ver:'ok', chk:'3/3', mem:20 },
  { id:'CH-18', tipo:'Camioneta 4x4', pat:'KT·VB-90', faena:'Sierra Norte', cond:'Carla Muñoz', est:'on', ult:'ahora', ver:'ok', chk:'2/3', mem:47 },
  { id:'GE-03', tipo:'Contenedor generador', pat:'—', faena:'Quebrada Alta', cond:'—', est:'off', ult:'hace 5 h', ver:'pend', chk:'1/1', mem:12 },
];

/* ===== Estado ===== */
// Enlace con el servidor de Apps Script: consulta el estado compartido cada 1,5 segundos.
const URL_APP = '<?= url ?>' + '?v=app';
const L = (function () {
  const subs = []; let estado = null, ver = -1;
  const aplicar = r => { if (r && r.ver !== ver) { ver = r.ver; estado = r; subs.forEach(f => f(estado)); } };
  const leer = () => google.script.run.withSuccessHandler(aplicar).withFailureHandler(() => {}).leer(ver);
  leer(); setInterval(leer, 1500);
  return { enviar: a => google.script.run.withSuccessHandler(aplicar).withFailureHandler(err => alert(err.message || err)).accion(a), on: f => { subs.push(f); if (estado) f(estado); }, aplicar };
})();
const PORTA = { CATEGORIAS: [
  { id: 'pts', nombre: 'Procedimientos de trabajo' }, { id: 'contratos', nombre: 'Contrato y reglamento' },
  { id: 'irl', nombre: 'Información de riesgos (IRL)' }, { id: 'hds', nombre: 'Hojas de datos de seguridad' }, { id: 'emergencia', nombre: 'Plan de emergencia' },

  if (!f) return;
  if (f.type !== 'application/pdf' && !f.name.toLowerCase().endsWith('.pdf')) { alert('Elige un archivo PDF.'); return; }
  if (f.size > 15 * 1024 * 1024) { alert('El PDF es muy grande para la demo (máximo 15 MB).'); return; }
  if (f.size > 3 * 1024 * 1024) { alert('Para la demo en línea, usa un PDF de hasta 3 MB.'); return; }
  const r = new FileReader(), zona = document.getElementById('drop');
  zona.classList.add('subiendo');
  r.onload = () => google.script.run.withSuccessHandler(e => { zona.classList.remove('subiendo'); L.aplicar(e); })
    .withFailureHandler(err => { zona.classList.remove('subiendo'); alert(err.message || err); })
    .subirPdf(f.name.replace(/\.pdf$/i, ''), C.cat, r.result.split(',')[1]);
  r.readAsDataURL(f);
};
window.soltar = ev => { ev.preventDefault(); document.getElementById('drop').classList.remove('sobre'); archivo(ev.dataTransfer.files[0]); };
window.ejemplo = () => L.enviar({ t: 'publicar', doc: { nombre: 'PTS-045 Manejo defensivo en ruta', cat: C.cat, pags: 3, html: `<h2>Manejo defensivo en ruta</h2><p>Procedimiento publicado hoy desde PORTA Central y recibido por 4G.</p>
  <h3>Antes de salir</h3><ol><li>Completar el checklist de vehículo y la autoevaluación de fatiga en PORTA.</li><li>Informar ruta y hora estimada de llegada por radio.</li></ol>
  <h3>En la ruta</h3><ul><li>Mantener 3 segundos de distancia con el vehículo de adelante (6 en ripio o con polvo).</li><li>Velocidad máxima 60 km/h en caminos de ripio.</li><li>Pausa de 15 minutos cada 2 horas de conducción.</li><li>Ante polvo en suspensión: reducir la velocidad y encender luces.</li></ul>
  <div class="aviso">⚠ Si sientes sueño, detente en un lugar seguro, avisa por radio y espera el relevo.</div>` } });

/* ===== Avisos (toasts) ===== */
function avisar(nuevos) {
  const box = document.getElementById('toasts');
  nuevos.forEach(n => {
    const t = document.createElement('div');
    t.className = 'toast ' + n.tipo;
    t.innerHTML = `<b>${n.titulo}</b><span>${n.texto}</span>${n.link ? `<a href="${n.link}">Ver</a>` : ''}`;
    box.prepend(t);
    setTimeout(() => t.classList.add('fuera'), 6500);
    setTimeout(() => t.remove(), 7200);
  });
}
function detectarNovedades(antes) {
  if (!antes) return;
  const nuevos = [];
  E.registros.filter(r => r.enviado && !antes.registros.find(x => x.id === r.id && x.enviado)).forEach(r => {
    nuevos.push(r.estado === 'mal'
      ? { tipo: 'mal', titulo: '⚠ Alerta recibida por 4G', texto: `${r.titulo} · ${r.quien}: ${r.res}`, link: '#/alertas' }
      : { tipo: r.estado === 'ok' ? 'ok' : 'al', titulo: 'Registro recibido por 4G', texto: `${r.titulo} · ${r.quien}: ${r.res}`, link: '#/alertas' });
  });
  E.docs.filter(d => d.enEquipo && antes.docs.find(x => x.id === d.id && !x.enEquipo)).forEach(d =>
    nuevos.push({ tipo: 'ok', titulo: 'Documento entregado', texto: `CH-04 recibió “${d.nombre}”`, link: '#/documentos' }));
  if (antes.senal4g !== E.senal4g) nuevos.push(E.senal4g
    ? { tipo: 'ok', titulo: 'CH-04 en línea', texto: 'El vehículo volvió a tener señal 4G' }
    : { tipo: 'gr', titulo: 'CH-04 sin señal', texto: 'El vehículo entró a una zona sin cobertura. Sigue funcionando en modo local.' });
  if (nuevos.length) avisar(nuevos);
}

/* ===== Router ===== */
function render() {
  if (!E) return;
  const h = (location.hash || '#/').slice(2).split('/');
  let act = 'flota', html;
  if (h[0] === 'documentos') { act = 'docs'; html = V.documentos(); }
  else if (h[0] === 'vehiculo') { act = 'veh'; html = V.vehiculo(); }
  else if (h[0] === 'alertas') { act = 'alertas'; html = V.alertas(); }
  else html = V.flota();
  document.getElementById('side').innerHTML = side(act);
  document.getElementById('main').innerHTML = html;
}
addEventListener('hashchange', () => { render(); scrollTo(0, 0); });
L.on(e => { const antes = E; E = e; render(); detectarNovedades(antes); });

/* ===== panel del presentador ===== */
(function () { const q = qrcode(0, 'M'); q.addData(URL_APP); q.make(); document.getElementById('qr').innerHTML = q.createSvgTag({ cellSize: 6, margin: 1, scalable: true }); })();
const PASOS = [
  ['publicado', '<b>Publica un documento</b> en Documentos (sube un PDF o usa el de ejemplo). Llega al vehículo por 4G.'],
  ['sinSenal', '<b>Apaga la señal 4G</b>: la camioneta entra a una zona sin cobertura.'],
  ['conectado', '<b>Escanea el QR</b> con un celular: se abre la app del trabajador.'],
  ['leido', '<b>En el celular abre el documento nuevo</b>: se lee aunque no haya señal.'],
  ['fatiga', '<b>Responde el checklist de fatiga</b> con sueño: resultado “No apto”.'],
  ['incidente', '<b>Opcional: marca un incidente</b> en la tarjeta Dashcam.'],
  ['alertaRecibida', '<b>Enciende la señal 4G</b>: la alerta llega sola a esta pantalla.'],
];
let alertaAntes = false;
L.on(e => {
  document.getElementById('sw-a').classList.toggle('on', !e.senal4g);
  document.getElementById('sw-b').classList.toggle('on', e.senal4g);
  const pd = e.docs.filter(d => !d.enEquipo).length, pr = e.registros.filter(r => !r.enviado).length;
  document.getElementById('enl-d').style.background = e.transfiriendo ? '#FF8A3D' : e.senal4g ? 'var(--ok)' : 'var(--pe)';
  document.getElementById('enl-t').textContent = e.transfiriendo ? 'Enviando por 4G…' : e.senal4g ? 'En línea por 4G' : (pd || pr) ? `Sin señal · en cola: ${pd ? pd + ' doc. ' : ''}${pr ? pr + ' registro(s)' : ''}` : 'Sin señal · funcionando en modo local';
  document.getElementById('conectados').textContent = e.conectados ? `${e.conectados} conexión${e.conectados > 1 ? 'es' : ''} desde celulares` : 'Ningún celular conectado aún';
  const idx = PASOS.findIndex(([k]) => !e.pasos[k] && k !== 'incidente');
  document.getElementById('guia').innerHTML = PASOS.map(([k, t], i) => `<div class="pp ${e.pasos[k] ? 'ok' : i === idx ? 'act' : ''}"><span class="nn">${e.pasos[k] ? '✓' : i + 1}</span><div>${t}</div></div>`).join('') +
    (idx === -1 ? '<div class="pp ok" style="color:#bfe8cf"><span class="nn">★</span><div>Demo completa. ¡Bien hecho!</div></div>' : '');
  if (!alertaAntes && e.pasos.alertaRecibida) setTimeout(() => location.hash = '#/alertas', 500);
  alertaAntes = !!e.pasos.alertaRecibida;
});



// evitar que un archivo soltado fuera de la zona de carga abra el PDF y saque al navegador de la demo
['dragover', 'drop'].forEach(t => addEventListener(t, ev => ev.preventDefault()));
</script>
